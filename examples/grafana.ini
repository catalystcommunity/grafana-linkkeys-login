; Grafana settings for grafana-linkkeys-login. Merge into grafana.ini, or set
; the same values as GF_<SECTION>_<KEY> environment variables.

[server]
; Grafana must not be reachable except through the proxy.
http_addr = 127.0.0.1
http_port = 3000
root_url = https://grafana.example.lan/

[auth]
disable_login_form = true
signout_redirect_url = https://grafana.example.lan/linkkeys/logout

[auth.basic]
enabled = false

[auth.anonymous]
enabled = false

[users]
allow_sign_up = false

[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
; Only the proxy may send identity headers. With Docker, use the proxy
; container's fixed address.
whitelist = 127.0.0.1, ::1
headers = Name:X-WEBAUTH-NAME, Email:X-WEBAUTH-EMAIL, Role:X-WEBAUTH-ROLE
; Minutes between role and profile updates from the headers.
sync_ttl = 5
enable_login_token = false
