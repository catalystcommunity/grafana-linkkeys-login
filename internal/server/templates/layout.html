{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{{.}} · Grafana</title>
<style>
  :root { --bg: #f4f5f5; --panel: #ffffff; --text: #24292e; --muted: #5a6370; --border: #d0d5db; --accent: #3d71d9; --error: #c4314b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111217; --panel: #181b1f; --text: #ccccdc; --muted: #9fa7b3; --border: #2f3237; --accent: #6e9fff; --error: #ff7389; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 28px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: var(--muted); }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text] { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); font: inherit; }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { font-size: 0.85rem; margin: 6px 0 0; }
  button, .button { display: inline-block; margin-top: 18px; width: 100%; padding: 9px 12px; border: 0; border-radius: 4px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; }
  .error { color: var(--error); }
  code { font-size: 0.9em; overflow-wrap: anywhere; }
</style>
</head>
<body>
{{end}}

{{define "foot"}}</body>
</html>
{{end}}
